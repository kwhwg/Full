name: '🚀 PTERODACTYL PANEL + WINGS + AUTO FIX'

on:
  workflow_dispatch:

jobs:
  full-install:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Install Panel + Wings + Auto Fix Node
      run: |
        echo "========================================="
        echo "🚀 INSTALLASI PTERODACTYL PANEL & WINGS"
        echo "========================================="

        # ==========================================
        # PART 1: INSTALL DEPENDENSI
        # ==========================================
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update -y && sudo apt upgrade -y

        # Tambah PPA ondrej/php (WAJIB untuk PHP 8.2 extensions)
        sudo apt install -y software-properties-common apt-transport-https ca-certificates gnupg
        sudo add-apt-repository ppa:ondrej/php -y
        sudo apt update -y

        sudo apt install -y \
          curl wget git unzip zip \
          mariadb-server \
          nginx \
          redis-server \
          php8.2 php8.2-cli php8.2-gd php8.2-mysql php8.2-mbstring \
          php8.2-tokenizer php8.2-bcmath php8.2-xml php8.2-fpm \
          php8.2-curl php8.2-zip php8.2-intl php8.2-sqlite3 \
          docker.io docker-compose

        # Start semua service yang dibutuhkan
        sudo systemctl enable --now docker
        sudo systemctl enable --now mariadb
        sudo systemctl enable --now redis-server
        sudo systemctl enable --now php8.2-fpm

        # Install composer
        curl -sS https://getcomposer.org/installer | sudo php -- \
          --install-dir=/usr/local/bin --filename=composer

        # Install Node.js 20
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt install -y nodejs

        # ==========================================
        # PART 2: SETUP DATABASE
        # ==========================================
        DB_PASS="PteroAuto2024!"

        sudo mysql -e "CREATE DATABASE IF NOT EXISTS panel;"
        sudo mysql -e "DROP USER IF EXISTS 'pterodactyl'@'localhost';"
        sudo mysql -e "CREATE USER 'pterodactyl'@'localhost' IDENTIFIED BY '${DB_PASS}';"
        sudo mysql -e "GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'localhost';"
        sudo mysql -e "FLUSH PRIVILEGES;"

        echo "✅ Database siap"

        # ==========================================
        # PART 3: INSTALL PANEL
        # ==========================================
        sudo mkdir -p /var/www/pterodactyl
        cd /var/www/pterodactyl

        sudo curl -Lo panel.tar.gz \
          https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz
        sudo tar -xzf panel.tar.gz --strip-components=1
        sudo rm -f panel.tar.gz

        # Set permission SEBELUM composer (bukan sesudah)
        sudo chown -R www-data:www-data /var/www/pterodactyl
        sudo find /var/www/pterodactyl -type f -exec chmod 644 {} \;
        sudo find /var/www/pterodactyl -type d -exec chmod 755 {} \;
        sudo chmod -R 775 /var/www/pterodactyl/storage /var/www/pterodactyl/bootstrap/cache

        # Install dependencies sebagai www-data
        sudo -u www-data bash -c "cd /var/www/pterodactyl && \
          composer install --no-dev --optimize-autoloader --no-interaction"

        # Setup .env
        sudo -u www-data cp /var/www/pterodactyl/.env.example /var/www/pterodactyl/.env

        # Konfigurasi .env
        sudo -u www-data sed -i "s|APP_URL=.*|APP_URL=http://localhost|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|DB_HOST=.*|DB_HOST=127.0.0.1|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|DB_PORT=.*|DB_PORT=3306|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|DB_DATABASE=.*|DB_DATABASE=panel|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|DB_USERNAME=.*|DB_USERNAME=pterodactyl|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${DB_PASS}|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|CACHE_DRIVER=.*|CACHE_DRIVER=redis|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=redis|" /var/www/pterodactyl/.env
        sudo -u www-data sed -i "s|QUEUE_CONNECTION=.*|QUEUE_CONNECTION=redis|" /var/www/pterodactyl/.env

        # Generate app key
        sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan key:generate --force"

        # Migrate database (tanpa --seed, panel tidak punya seeder publik)
        sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan migrate --force"

        echo "✅ Panel terinstall"

        # ==========================================
        # PART 4: BUAT DATA AWAL (LOCATION + ADMIN)
        # ==========================================

        # Tulis PHP script ke file (lebih reliable dari --execute)
        sudo tee /tmp/setup_data.php > /dev/null << 'PHPEOF'
        <?php
        use App\Models\Location;
        use App\Models\User;

        // Buat location
        if (!Location::find(1)) {
            Location::create(['short' => 'auto', 'long' => 'Auto Location']);
            echo "[OK] Location created\n";
        } else {
            echo "[OK] Location already exists\n";
        }

        // Buat admin user
        if (!User::where('email', 'admin@sylent.com')->exists()) {
            User::create([
                'email'      => 'admin@sylent.com',
                'username'   => 'sylentadmin',
                'name_first' => 'Sylent',
                'name_last'  => 'Admin',
                'password'   => bcrypt('Admin123!'),
                'root_admin' => true,
                'use_totp'   => false,
            ]);
            echo "[OK] Admin created\n";
        } else {
            echo "[OK] Admin already exists\n";
        }
        PHPEOF

        sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan tinker --execute=\"\$(cat /tmp/setup_data.php)\""

        # ==========================================
        # PART 5: BUAT NODE VIA PHP SCRIPT
        # ==========================================
        PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me || curl -s --max-time 10 api.ipify.org)
        echo "Public IP: $PUBLIC_IP"

        sudo tee /tmp/create_node.php > /dev/null << PHPEOF
        <?php
        use App\Models\Node;

        \$node = Node::where('name', 'AutoNode')->first();
        if (!\$node) {
            \$node = Node::create([
                'name'               => 'AutoNode',
                'description'        => 'Auto created node',
                'location_id'        => 1,
                'fqdn'               => '${PUBLIC_IP}',
                'scheme'             => 'http',
                'memory'             => 8192,
                'memory_overallocate'=> 0,
                'disk'               => 102400,
                'disk_overallocate'  => 0,
                'upload_size'        => 100,
                'daemon_listen'      => 8080,
                'daemon_sftp'        => 2022,
                'public'             => true,
                'behind_proxy'       => false,
            ]);
        }
        // Output harus 1 baris: token_id|token
        echo \$node->daemon_token_id . '|' . decrypt(\$node->daemon_token);
        PHPEOF

        NODE_RAW=$(sudo -u www-data bash -c \
          "cd /var/www/pterodactyl && php artisan tinker --execute=\"\$(cat /tmp/create_node.php)\"" \
          2>/dev/null | grep -v "^>" | grep -v "^\[" | grep "|" | head -1)

        NODE_TOKEN_ID=$(echo "$NODE_RAW" | cut -d'|' -f1)
        NODE_TOKEN=$(echo "$NODE_RAW" | cut -d'|' -f2)

        echo "Node token_id: ${NODE_TOKEN_ID:0:8}... [OK]"
        echo "Node token: ${NODE_TOKEN:0:8}... [OK]"

        # ==========================================
        # PART 6: KONFIGURASI NGINX
        # Panel = port 80 | Wings = port 8080 (BEDA PORT, wajib!)
        # ==========================================
        sudo tee /etc/nginx/sites-available/pterodactyl > /dev/null << 'NGINXEOF'
server {
    listen 80;
    server_name _;
    root /var/www/pterodactyl/public;
    index index.php;

    access_log /var/log/nginx/pterodactyl.access.log;
    error_log  /var/log/nginx/pterodactyl.error.log error;

    client_max_body_size 100m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
NGINXEOF

        sudo ln -sf /etc/nginx/sites-available/pterodactyl \
          /etc/nginx/sites-enabled/pterodactyl
        sudo rm -f /etc/nginx/sites-enabled/default

        sudo nginx -t && sudo systemctl restart nginx
        echo "✅ Nginx dikonfigurasi (port 80)"

        # ==========================================
        # PART 7: INSTALL WINGS
        # Wings pakai port 8080 (berbeda dari panel di port 80)
        # ==========================================
        sudo mkdir -p /etc/pterodactyl /var/lib/pterodactyl/volumes /var/run/wings

        sudo curl -Lo /usr/local/bin/wings \
          https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_amd64
        sudo chmod +x /usr/local/bin/wings

        # Generate UUID untuk Wings
        WINGS_UUID=$(cat /proc/sys/kernel/random/uuid)

        # Buat config.yml Wings (tanpa indentasi di heredoc!)
        sudo tee /etc/pterodactyl/config.yml > /dev/null << WINGSEOF
debug: false
uuid: ${WINGS_UUID}
token_id: "${NODE_TOKEN_ID}"
token: "${NODE_TOKEN}"
api:
  host: "0.0.0.0"
  port: 8080
  ssl:
    enabled: false
    cert: ""
    key: ""
  upload_limit: 100
system:
  data: /var/lib/pterodactyl/volumes
  sftp:
    bind_port: 2022
allowed_mounts: []
remote: "http://${PUBLIC_IP}"
WINGSEOF

        echo "✅ Wings config dibuat"
        cat /etc/pterodactyl/config.yml

        # Buat systemd service Wings
        sudo tee /etc/systemd/system/wings.service > /dev/null << 'SVCEOF'
[Unit]
Description=Pterodactyl Wings Daemon
After=docker.service network.target
Requires=docker.service

[Service]
User=root
WorkingDirectory=/etc/pterodactyl
LimitNOFILE=4096
PIDFile=/var/run/wings/daemon.pid
ExecStart=/usr/local/bin/wings
Restart=on-failure
StartLimitInterval=180
StartLimitBurst=30
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
SVCEOF

        sudo systemctl daemon-reload
        sudo systemctl enable wings
        sudo systemctl start wings

        echo "✅ Wings service dimulai"

        # ==========================================
        # PART 8: QUEUE WORKER (dibutuhkan panel)
        # ==========================================
        sudo tee /etc/systemd/system/pteroq.service > /dev/null << 'QEOF'
[Unit]
Description=Pterodactyl Queue Worker
After=redis-server.service

[Service]
User=www-data
Group=www-data
Restart=always
ExecStart=/usr/bin/php /var/www/pterodactyl/artisan queue:work --queue=high,standard,low --sleep=3 --tries=3
StartLimitInterval=180
StartLimitBurst=30
RestartSec=5s

[Install]
WantedBy=multi-user.target
QEOF

        sudo systemctl daemon-reload
        sudo systemctl enable --now pteroq

        # ==========================================
        # PART 9: CEK NODE (AUTO FIX KALO MERAH)
        # ==========================================
        echo ""
        echo "========================================="
        echo "🔍 CEK STATUS NODE & AUTO FIX"
        echo "========================================="

        # Tunggu Wings fully up
        sleep 15

        check_node() {
          local retry=0
          local max=15
          while [ $retry -lt $max ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:8080/api/system 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
              echo "  → Wings merespon (HTTP $HTTP_CODE) ✅"
              return 0
            fi
            echo "  [${retry}/${max}] Wings belum ready (HTTP: $HTTP_CODE), tunggu..."
            retry=$((retry + 1))
            sleep 6
          done
          return 1
        }

        fix_wings() {
          echo "🔧 Menjalankan auto fix..."

          # Pastikan port terbuka
          sudo ufw allow 80/tcp  2>/dev/null || true
          sudo ufw allow 8080/tcp 2>/dev/null || true
          sudo ufw allow 2022/tcp 2>/dev/null || true

          # Restart docker dulu
          sudo systemctl restart docker
          sleep 5

          # Fix permission
          sudo chown -R root:root /etc/pterodactyl
          sudo chmod 600 /etc/pterodactyl/config.yml

          # Restart semua
          sudo systemctl restart nginx php8.2-fpm pteroq
          sudo systemctl restart wings
          sleep 15
        }

        if check_node; then
          NODE_STATUS_TEXT="🟢 HIJAU (Connected)"
        else
          echo "⚠️ Wings belum merespon, jalankan auto fix..."
          fix_wings
          if check_node; then
            NODE_STATUS_TEXT="🟢 HIJAU (Setelah auto fix)"
          else
            NODE_STATUS_TEXT="🔴 MERAH (Cek log: journalctl -u wings -f)"
          fi
        fi

        # Print wings log untuk debug
        echo ""
        echo "--- Wings log (10 baris terakhir) ---"
        sudo journalctl -u wings --no-pager -n 10 || true
        echo "--------------------------------------"

        # ==========================================
        # PART 10: CLOUDFLARE TUNNEL
        # Tunnel ke port 80 (panel), bukan 8080 (wings)
        # ==========================================
        wget -q \
          https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
          -O /usr/local/bin/cloudflared
        chmod +x /usr/local/bin/cloudflared

        # Jalankan tunnel ke panel (port 80)
        cloudflared tunnel --url http://localhost:80 \
          --logfile /tmp/cf.log \
          --no-autoupdate &
        sleep 20

        CF_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' /tmp/cf.log | head -1)

        # Update APP_URL di .env supaya link di panel benar
        if [ -n "$CF_URL" ]; then
          sudo -u www-data sed -i "s|APP_URL=.*|APP_URL=${CF_URL}|" /var/www/pterodactyl/.env
          sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan config:clear && php artisan cache:clear"
        fi

        # ==========================================
        # PART 11: TAMPILKAN HASIL LENGKAP
        # ==========================================
        echo ""
        echo "========================================="
        echo "✅ INSTALASI SELESAI"
        echo "========================================="
        echo ""
        echo "🌐 PANEL URL:"
        if [ -n "$CF_URL" ]; then
          echo "   $CF_URL  ← gunakan ini (Cloudflare)"
        fi
        echo "   http://$PUBLIC_IP  ← IP langsung (port 80)"
        echo ""
        echo "🔑 LOGIN CREDENTIALS:"
        echo "   Email    : admin@sylent.com"
        echo "   Password : Admin123!"
        echo ""
        echo "📌 NODE INFO:"
        echo "   Status   : $NODE_STATUS_TEXT"
        echo "   Wings API: http://$PUBLIC_IP:8080"
        echo "   SFTP Port: 2022"
        echo "   IP       : $PUBLIC_IP"
        echo ""
        echo "🔧 SERVICES:"
        sudo systemctl is-active nginx      | xargs echo "   nginx      :"
        sudo systemctl is-active php8.2-fpm | xargs echo "   php8.2-fpm :"
        sudo systemctl is-active mariadb    | xargs echo "   mariadb    :"
        sudo systemctl is-active redis      | xargs echo "   redis      :"
        sudo systemctl is-active wings      | xargs echo "   wings      :"
        sudo systemctl is-active pteroq     | xargs echo "   pteroq     :"
        echo ""

        if echo "$NODE_STATUS_TEXT" | grep -q "MERAH"; then
          echo "⚠️  NODE MASIH MERAH — coba manual:"
          echo "   sudo journalctl -u wings -f"
          echo "   sudo systemctl restart wings"
          echo "   cat /etc/pterodactyl/config.yml"
        fi

        echo "========================================="

        # ==========================================
        # PART 12: KEEP ALIVE + MONITOR
        # ==========================================
        while true; do
          WINGS_OK=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 5 http://localhost:8080/api/system 2>/dev/null || echo "000")
          PANEL_OK=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 5 http://localhost/api/application/nodes \
            -H "Authorization: Bearer invalid" 2>/dev/null || echo "000")

          # Auto restart wings kalau down
          if [ "$WINGS_OK" = "000" ]; then
            echo "[$(date)] ⚠️ Wings down, auto restart..."
            sudo systemctl restart wings
          fi

          echo "[$(date)] Panel:${PANEL_OK} Wings:${WINGS_OK} | ${CF_URL:-http://$PUBLIC_IP}"
          sleep 240
        done
