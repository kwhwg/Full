name: 🔥 ROOT VPS FULL ACCESS (FIXED)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  root-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: 🚀 Setup Root VPS
      run: |
        echo "========================================="
        echo "🔥 MEMBANGUN VPS DENGAN AKSES ROOT 🔥"
        echo "========================================="
        
        # Update system
        sudo apt update && sudo apt upgrade -y
        
        # Install SSH server & tools
        sudo apt install -y openssh-server curl wget git nano htop net-tools screen tmux
        
        # Set password root (GANTI SESUKA LO)
        echo "root:sylentgacor123" | sudo chpasswd
        
        # Allow root login with password
        sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo systemctl restart ssh
        
        # Install Cloudflared (alternatif pinggy, lebih stabil)
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        
        # Install Node.js 20
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt install -y nodejs
        
        # Install Python & pip
        sudo apt install -y python3 python3-pip
        
        # Install Docker
        curl -fsSL https://get.docker.com | sudo bash
        sudo usermod -aG docker $USER
        
        # Buat user baru
        sudo useradd -m -s /bin/bash sylent
        echo "sylent:gacor456" | sudo chpasswd
        sudo usermod -aG sudo sylent
        
        # Tampilkan info
        echo ""
        echo "========================================="
        echo "✅ VPS READY"
        echo "========================================="
        echo "📱 ROOT PASSWORD: sylentgacor123"
        echo "👤 USER PASSWORD: gacor456"
        echo "🌐 IP VPS: $(curl -s ifconfig.me)"
        echo "========================================="
        
    - name: 🔓 Buka SSH Tunnel dengan Cloudflare
      run: |
        # Buat script buat tunnel SSH
        cat > start-tunnel.sh << 'EOF'
        #!/bin/bash
        # Tunnel SSH port 22 ke Cloudflare
        cloudflared tunnel --url ssh://localhost:22 --logfile cloudflared.log &
        sleep 8
        
        # Ambil URL dari log
        URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' cloudflared.log | head -1)
        echo "========================================="
        echo "🌐 SSH VIA CLOUDFLARE TUNNEL"
        echo "========================================="
        echo "URL: $URL"
        echo ""
        echo "CARA AKSES SSH:"
        echo "1. Buka terminal lo"
        echo "2. Jalanin: ssh root@$URL"
        echo "   Atau kalo error, pake:"
        echo "   ssh -o ProxyCommand='cloudflared access ssh --hostname %h' root@$URL"
        echo "3. Password: sylentgacor123"
        echo "========================================="
        
        # Simpan URL ke file
        echo "$URL" > public-url.txt
        
        # Keep alive
        while true; do
          sleep 60
          echo "[$(date)] 🔥 ROOT VPS MASIH HIDUP"
          ps aux | grep cloudflared | grep -v grep
        done
        EOF
        
        chmod +x start-tunnel.sh
        ./start-tunnel.sh
        
    - name: 📝 Simpan Info Akses
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vps-access-info
        path: |
          public-url.txt
          cloudflared.log
