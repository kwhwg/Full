name: '🔥 VPS WITH NGROK 🔥'

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Setup VPS with SSH
      run: |
        # Set password root (GANTI SESUKA LO)
        echo "root:sylentgacor123" | sudo chpasswd
        
        # Install SSH server
        sudo apt update
        sudo apt install -y openssh-server curl wget
        
        # Konfigurasi SSH biar bisa login pake password
        sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo systemctl restart sshd
        
        # Install ngrok
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        tar -xzf ngrok-v3-stable-linux-amd64.tgz
        sudo mv ngrok /usr/local/bin/
        
        # Auth dengan token lo
        ngrok config add-authtoken 3BbX5sAIqWgkFUGwiU0gHRhNXSX_5DpNakDAN2CXygxNdqEkQ
        
        # Tunnel SSH port 22
        ngrok tcp 22 --region ap &
        
        # Tunggu tunnel aktif
        sleep 8
        
        # Ambil URL ngrok
        echo "========================================="
        echo "🔥 VPS READY 🔥"
        echo "========================================="
        
        NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[0-9a-z.-]*:[0-9]*')
        echo "🌐 NGROK URL: $NGROK_URL"
        
        # Extract host dan port
        HOST=$(echo $NGROK_URL | cut -d'/' -f3 | cut -d':' -f1)
        PORT=$(echo $NGROK_URL | cut -d':' -f3)
        
        echo ""
        echo "========================================="
        echo "📱 LOGIN KE VPS LO:"
        echo "   ssh root@$HOST -p $PORT"
        echo "   Password: sylentgacor123"
        echo "========================================="
        echo ""
        echo "Contoh di Termux:"
        echo "ssh root@$HOST -p $PORT"
        echo ""
        
        # Simpan info ke file
        echo "SSH_COMMAND: ssh root@$HOST -p $PORT" > vps-info.txt
        echo "PASSWORD: sylentgacor123" >> vps-info.txt
        
        # Keep alive - biar workflow gak mati
        while true; do
          echo "[$(date)] 🔥 VPS MASIH HIDUP - SSH aktif di $HOST:$PORT"
          sleep 60
        done
        
    - name: Save VPS Info
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vps-ssh-info
        path: vps-info.txt
