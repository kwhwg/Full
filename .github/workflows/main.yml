name: '🚀 PTERODACTYL PANEL + WINGS + AUTO FIX'

on:
  workflow_dispatch:

jobs:
  full-install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Install Panel + Wings + Auto Fix Node
      run: |
        echo "========================================="
        echo "🚀 INSTALLASI PTERODACTYL PANEL & WINGS"
        echo "========================================="
        
        # ==========================================
        # PART 1: INSTALL DEPENDENSI PANEL
        # ==========================================
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y curl wget git mariadb-server nginx redis-server \
          php8.2 php8.2-{cli,gd,mysql,pdo,mbstring,tokenizer,bcmath,xml,fpm,curl,zip,intl} \
          certbot python3-certbot-nginx unzip zip docker.io docker-compose
        
        sudo systemctl enable --now docker
        
        curl -sS https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt install -y nodejs
        
        # ==========================================
        # PART 2: INSTALL PANEL
        # ==========================================
        cd /var/www
        sudo curl -Lo panel.tar.gz https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz
        sudo tar -xzvf panel.tar.gz
        sudo mv panel-* pterodactyl
        cd pterodactyl
        sudo chown -R www-data:www-data *
        sudo chmod -R 755 storage bootstrap/cache
        
        sudo composer install --no-dev --optimize-autoloader
        sudo cp .env.example .env
        sudo php artisan key:generate --force
        
        # Setup database
        DB_PASS="PteroAuto2024!"
        sudo mysql -e "CREATE DATABASE IF NOT EXISTS panel;"
        sudo mysql -e "CREATE USER IF NOT EXISTS 'pterodactyl'@'localhost' IDENTIFIED BY '$DB_PASS';"
        sudo mysql -e "GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'localhost';"
        sudo mysql -e "FLUSH PRIVILEGES;"
        
        sudo sed -i "s/DB_DATABASE=laravel/DB_DATABASE=panel/" .env
        sudo sed -i "s/DB_USERNAME=root/DB_USERNAME=pterodactyl/" .env
        sudo sed -i "s/DB_PASSWORD=/DB_PASSWORD='$DB_PASS'/" .env
        
        sudo php artisan migrate --force
        
        # Buat admin
        sudo php artisan tinker --execute="
          use App\Models\User;
          if(!User::where('email', 'admin@sylent.com')->first()) {
            \$user = User::create([
              'email' => 'admin@sylent.com',
              'username' => 'sylentadmin',
              'password' => bcrypt('Admin123!'),
              'root_admin' => true,
            ]);
            echo 'Admin created';
          }
        "
        
        # ==========================================
        # PART 3: KONFIGURASI NGINX
        # ==========================================
        sudo cat > /etc/nginx/sites-available/pterodactyl << 'EOF'
        server {
            listen 8080;
            server_name _;
            root /var/www/pterodactyl/public;
            index index.php;
        
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }
        
            location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            }
        }
        EOF
        
        sudo ln -s /etc/nginx/sites-available/pterodactyl /etc/nginx/sites-enabled/
        sudo rm -f /etc/nginx/sites-enabled/default
        sudo systemctl restart nginx php8.2-fpm
        
        # ==========================================
        # PART 4: INSTALL WINGS
        # ==========================================
        sudo mkdir -p /etc/pterodactyl
        sudo curl -Lo /usr/local/bin/wings https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_amd64
        sudo chmod u+x /usr/local/bin/wings
        
        # Dapatkan token dari panel (auto generate)
        PUBLIC_IP=$(curl -s ifconfig.me)
        
        # Panggil API panel buat dapetin token
        echo "Menunggu panel ready..."
        sleep 5
        
        # Ambil token dari panel (via API internal)
        cd /var/www/pterodactyl
        NODE_TOKEN=$(sudo php artisan tinker --execute="
          use App\Models\Node;
          \$node = Node::create([
            'name' => 'AutoNode',
            'description' => 'Auto created node',
            'location_id' => 1,
            'fqdn' => '$PUBLIC_IP',
            'scheme' => 'http',
            'memory' => '8192',
            'memory_overallocate' => '0',
            'disk' => '102400',
            'disk_overallocate' => '0',
            'upload_size' => '100',
            'daemon_listen' => 8080,
            'daemon_sftp' => 2022,
            'public' => 1,
          ]);
          echo \$node->getDecryptedKey();
        " 2>/dev/null | tail -1)
        
        # Buat config.yml wings
        sudo cat > /etc/pterodactyl/config.yml << EOF
        debug: false
        uuid: $(uuidgen)
        token_id: "auto"
        token: "$NODE_TOKEN"
        api:
          host: "0.0.0.0"
          port: 8080
          ssl:
            enabled: false
          upload_limit: 100
        system:
          data: /var/lib/pterodactyl/volumes
          sftp:
            bind_port: 2022
        allowed_mounts: []
        remote: "http://$PUBLIC_IP"
        EOF
        
        # Buat service wings
        sudo cat > /etc/systemd/system/wings.service << 'EOF'
        [Unit]
        Description=Pterodactyl Wings Daemon
        After=docker.service
        Requires=docker.service
        PartOf=docker.service
        
        [Service]
        User=root
        WorkingDirectory=/etc/pterodactyl
        LimitNOFILE=4096
        PIDFile=/var/run/wings/daemon.pid
        ExecStart=/usr/local/bin/wings
        Restart=on-failure
        StartLimitInterval=180
        StartLimitBurst=30
        RestartSec=5s
        
        [Install]
        WantedBy=multi-user.target
        EOF
        
        sudo systemctl daemon-reload
        sudo systemctl enable --now wings
        
        # ==========================================
        # PART 5: CEK NODE (AUTO FIX KALO MERAH)
        # ==========================================
        echo ""
        echo "========================================="
        echo "🔍 CEK STATUS NODE"
        echo "========================================="
        
        # Tunggu wings jalan
        sleep 10
        
        # Function cek node
        check_node() {
          local retry=0
          while [ $retry -lt 12 ]; do
            NODE_STATUS=$(curl -s http://localhost:8080/api/status 2>/dev/null || echo "down")
            if echo "$NODE_STATUS" | grep -q "ok"; then
              return 0
            fi
            echo "[${retry}/12] Node masih merah, mencoba fix..."
            retry=$((retry+1))
            sleep 5
          done
          return 1
        }
        
        # Auto fix function
        fix_wings() {
          echo "🔧 Melakukan auto fix..."
          
          # Fix 1: Restart wings
          sudo systemctl restart wings
          sleep 5
          
          # Fix 2: Cek port
          sudo ufw allow 8080/tcp 2>/dev/null
          sudo ufw allow 2022/tcp 2>/dev/null
          
          # Fix 3: Cek docker
          sudo systemctl restart docker
          
          # Fix 4: Permission fix
          sudo chown -R root:root /etc/pterodactyl
          sudo chmod -R 755 /etc/pterodactyl
          
          # Fix 5: Restart all
          sudo systemctl restart nginx php8.2-fpm wings
          sleep 10
        }
        
        # Cek node dengan retry
        if check_node; then
          NODE_STATUS_TEXT="🟢 HIJAU (Connected)"
        else
          echo "⚠️ Node merah, menjalankan auto fix..."
          fix_wings
          if check_node; then
            NODE_STATUS_TEXT="🟢 HIJAU (Setelah auto fix)"
          else
            NODE_STATUS_TEXT="🔴 MERAH (Perlu manual fix)"
          fi
        fi
        
        # ==========================================
        # PART 6: CLOUDFLARE TUNNEL
        # ==========================================
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
        
        cloudflared tunnel --url http://localhost:8080 --logfile /tmp/cf.log &
        sleep 10
        
        CF_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
        
        # ==========================================
        # PART 7: TAMPILKAN HASIL
        # ==========================================
        echo ""
        echo "========================================="
        echo "✅ INSTALLASI SELESAI"
        echo "========================================="
        echo ""
        echo "🌐 PANEL URL:"
        echo "   $CF_URL"
        echo "   http://$PUBLIC_IP:8080"
        echo ""
        echo "🔑 LOGIN CREDENTIALS:"
        echo "   Email: admin@sylent.com"
        echo "   Password: Admin123!"
        echo ""
        echo "🟢 NODE STATUS: $NODE_STATUS_TEXT"
        echo ""
        echo "📌 NODE INFO:"
        echo "   Port Wings: 8080"
        echo "   Port SFTP: 2022"
        echo "   IP: $PUBLIC_IP"
        echo ""
        
        if echo "$NODE_STATUS_TEXT" | grep -q "MERAH"; then
          echo "⚠️ NODE MASIH MERAH! Manual fix:"
          echo "   sudo systemctl restart wings"
          echo "   journalctl -u wings -f"
        fi
        
        echo "========================================="
        
        # ==========================================
        # PART 8: KEEP ALIVE
        # ==========================================
        while true; do
          echo "[$(date)] 🟢 Panel: $CF_URL | Node: $NODE_STATUS_TEXT"
          sleep 300
        done
