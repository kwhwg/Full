name: '🚀 PTERODACTYL PANEL + WINGS + AUTO FIX'

on:
  workflow_dispatch:

jobs:
  full-install:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # --------------------------------------------------
      # PART 1: INSTALL SEMUA DEPENDENSI
      # --------------------------------------------------
      - name: 1 - Install Dependensi Sistem
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y software-properties-common apt-transport-https ca-certificates gnupg
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt update -y
          sudo apt install -y \
            curl wget git unzip zip \
            mariadb-server nginx redis-server \
            php8.2 php8.2-cli php8.2-gd php8.2-mysql php8.2-mbstring \
            php8.2-tokenizer php8.2-bcmath php8.2-xml php8.2-fpm \
            php8.2-curl php8.2-zip php8.2-intl php8.2-sqlite3 \
            docker.io docker-compose python3
          sudo systemctl enable --now docker
          sudo systemctl enable --now mariadb
          sudo systemctl enable --now redis-server
          sudo systemctl enable --now php8.2-fpm
          curl -sS https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt install -y nodejs
          echo "✅ Semua dependensi terinstall"

      # --------------------------------------------------
      # PART 2: SETUP DATABASE
      # --------------------------------------------------
      - name: 2 - Setup Database MariaDB
        run: |
          DB_PASS="PteroAuto2024!"
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS panel;"
          sudo mysql -e "DROP USER IF EXISTS 'pterodactyl'@'localhost';"
          sudo mysql -e "CREATE USER 'pterodactyl'@'localhost' IDENTIFIED BY '${DB_PASS}';"
          sudo mysql -e "GRANT ALL PRIVILEGES ON panel.* TO 'pterodactyl'@'localhost';"
          sudo mysql -e "FLUSH PRIVILEGES;"
          echo "✅ Database siap"

      # --------------------------------------------------
      # PART 3: INSTALL PANEL
      # --------------------------------------------------
      - name: 3 - Install Pterodactyl Panel
        run: |
          DB_PASS="PteroAuto2024!"
          sudo mkdir -p /var/www/pterodactyl
          cd /var/www/pterodactyl
          sudo curl -Lo panel.tar.gz https://github.com/pterodactyl/panel/releases/latest/download/panel.tar.gz
          sudo tar -xzf panel.tar.gz --strip-components=1
          sudo rm -f panel.tar.gz
          sudo chown -R www-data:www-data /var/www/pterodactyl
          sudo find /var/www/pterodactyl -type f -exec chmod 644 {} \;
          sudo find /var/www/pterodactyl -type d -exec chmod 755 {} \;
          sudo chmod -R 775 /var/www/pterodactyl/storage /var/www/pterodactyl/bootstrap/cache
          sudo -u www-data bash -c "cd /var/www/pterodactyl && composer install --no-dev --optimize-autoloader --no-interaction"
          sudo -u www-data cp /var/www/pterodactyl/.env.example /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|APP_URL=.*|APP_URL=http://localhost|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|DB_HOST=.*|DB_HOST=127.0.0.1|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|DB_PORT=.*|DB_PORT=3306|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|DB_DATABASE=.*|DB_DATABASE=panel|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|DB_USERNAME=.*|DB_USERNAME=pterodactyl|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${DB_PASS}|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|CACHE_DRIVER=.*|CACHE_DRIVER=redis|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=redis|" /var/www/pterodactyl/.env
          sudo -u www-data sed -i "s|QUEUE_CONNECTION=.*|QUEUE_CONNECTION=redis|" /var/www/pterodactyl/.env
          sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan key:generate --force"
          sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan migrate --force"
          echo "✅ Panel terinstall"

      # --------------------------------------------------
      # PART 4: BUAT LOCATION + ADMIN USER
      # --------------------------------------------------
      - name: 4 - Buat Location dan Admin User
        run: |
          python3 - << 'PYEOF'
          import subprocess, textwrap

          php_code = textwrap.dedent("""
          <?php
          use App\\Models\\Location;
          use App\\Models\\User;

          if (!Location::find(1)) {
              Location::create(['short' => 'auto', 'long' => 'Auto Location']);
              echo "[OK] Location created\\n";
          } else {
              echo "[OK] Location exists\\n";
          }

          if (!User::where('email', 'admin@sylent.com')->exists()) {
              User::create([
                  'email'      => 'admin@sylent.com',
                  'username'   => 'sylentadmin',
                  'name_first' => 'Sylent',
                  'name_last'  => 'Admin',
                  'password'   => bcrypt('Admin123!'),
                  'root_admin' => True,
                  'use_totp'   => False,
              ]);
              echo "[OK] Admin created\\n";
          } else {
              echo "[OK] Admin exists\\n";
          }
          """)

          with open('/tmp/setup_data.php', 'w') as f:
              f.write(php_code)

          result = subprocess.run(
              ['sudo', '-u', 'www-data', 'bash', '-c',
               'cd /var/www/pterodactyl && php artisan tinker --execute="$(cat /tmp/setup_data.php)"'],
              capture_output=True, text=True
          )
          print(result.stdout)
          if result.returncode != 0:
              print("STDERR:", result.stderr)
          PYEOF
          echo "✅ Location dan admin siap"

      # --------------------------------------------------
      # PART 5: KONFIGURASI NGINX (panel = port 80)
      # --------------------------------------------------
      - name: 5 - Konfigurasi Nginx
        run: |
          python3 - << 'PYEOF'
          nginx_conf = r"""server {
              listen 80;
              server_name _;
              root /var/www/pterodactyl/public;
              index index.php;

              access_log /var/log/nginx/pterodactyl.access.log;
              error_log  /var/log/nginx/pterodactyl.error.log error;

              client_max_body_size 100m;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  include fastcgi_params;
                  fastcgi_read_timeout 300;
              }

              location ~ /\.ht {
                  deny all;
              }
          }
          """
          with open('/tmp/pterodactyl.nginx', 'w') as f:
              f.write(nginx_conf)
          print("Nginx config ditulis")
          PYEOF
          sudo cp /tmp/pterodactyl.nginx /etc/nginx/sites-available/pterodactyl
          sudo ln -sf /etc/nginx/sites-available/pterodactyl /etc/nginx/sites-enabled/pterodactyl
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          echo "✅ Nginx aktif di port 80"

      # --------------------------------------------------
      # PART 6: INSTALL WINGS + BUAT NODE
      # --------------------------------------------------
      - name: 6 - Install Wings dan Buat Node
        run: |
          PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me || curl -s --max-time 10 api.ipify.org)
          echo "Public IP: $PUBLIC_IP"

          sudo mkdir -p /etc/pterodactyl /var/lib/pterodactyl/volumes /var/run/wings
          sudo curl -Lo /usr/local/bin/wings \
            https://github.com/pterodactyl/wings/releases/latest/download/wings_linux_amd64
          sudo chmod +x /usr/local/bin/wings

          python3 - << PYEOF
          import subprocess

          public_ip = "$PUBLIC_IP"

          php_code = """<?php
          use App\\\\Models\\\\Node;

          \\$node = Node::where('name', 'AutoNode')->first();
          if (!\\$node) {
              \\$node = Node::create([
                  'name'                => 'AutoNode',
                  'description'         => 'Auto created node',
                  'location_id'         => 1,
                  'fqdn'                => '{ip}',
                  'scheme'              => 'http',
                  'memory'              => 8192,
                  'memory_overallocate' => 0,
                  'disk'                => 102400,
                  'disk_overallocate'   => 0,
                  'upload_size'         => 100,
                  'daemon_listen'       => 8080,
                  'daemon_sftp'         => 2022,
                  'public'              => true,
                  'behind_proxy'        => false,
              ]);
          }
          echo \\$node->daemon_token_id . '|' . decrypt(\\$node->daemon_token);
          """.format(ip=public_ip)

          with open('/tmp/create_node.php', 'w') as f:
              f.write(php_code)

          result = subprocess.run(
              ['sudo', '-u', 'www-data', 'bash', '-c',
               'cd /var/www/pterodactyl && php artisan tinker --execute="$(cat /tmp/create_node.php)"'],
              capture_output=True, text=True
          )

          raw = result.stdout.strip()
          lines = [l for l in raw.splitlines() if '|' in l and not l.startswith('[') and not l.startswith('>')]
          if not lines:
              print("ERROR: Tidak bisa dapat token node")
              print("Output:", raw)
              print("Stderr:", result.stderr)
              exit(1)

          token_parts = lines[-1].strip().split('|', 1)
          token_id = token_parts[0].strip()
          token    = token_parts[1].strip() if len(token_parts) > 1 else ''

          print(f"token_id: {token_id[:8]}...")
          print(f"token   : {token[:8]}...")

          with open('/tmp/node_token_id', 'w') as f:
              f.write(token_id)
          with open('/tmp/node_token', 'w') as f:
              f.write(token)
          PYEOF

          WINGS_UUID=$(cat /proc/sys/kernel/random/uuid)

          python3 - << PYEOF2
          import textwrap

          wings_uuid = "$WINGS_UUID"
          token_id   = open('/tmp/node_token_id').read().strip()
          token      = open('/tmp/node_token').read().strip()
          public_ip  = "$PUBLIC_IP"

          config = textwrap.dedent(f"""
          debug: false
          uuid: {wings_uuid}
          token_id: "{token_id}"
          token: "{token}"
          api:
            host: "0.0.0.0"
            port: 8080
            ssl:
              enabled: false
              cert: ""
              key: ""
            upload_limit: 100
          system:
            data: /var/lib/pterodactyl/volumes
            sftp:
              bind_port: 2022
          allowed_mounts: []
          remote: "http://{public_ip}"
          """).lstrip()

          with open('/tmp/wings_config.yml', 'w') as f:
              f.write(config)
          print("Wings config:")
          print(config)
          PYEOF2

          sudo cp /tmp/wings_config.yml /etc/pterodactyl/config.yml
          sudo chmod 600 /etc/pterodactyl/config.yml
          echo "✅ Wings config OK"

      # --------------------------------------------------
      # PART 7: BUAT SYSTEMD SERVICES
      # --------------------------------------------------
      - name: 7 - Setup Systemd Services (Wings + Queue)
        run: |
          python3 - << 'PYEOF'
          import textwrap

          wings_svc = textwrap.dedent("""
          [Unit]
          Description=Pterodactyl Wings Daemon
          After=docker.service network.target
          Requires=docker.service

          [Service]
          User=root
          WorkingDirectory=/etc/pterodactyl
          LimitNOFILE=4096
          PIDFile=/var/run/wings/daemon.pid
          ExecStart=/usr/local/bin/wings
          Restart=on-failure
          StartLimitInterval=180
          StartLimitBurst=30
          RestartSec=5s
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          """).lstrip()

          pteroq_svc = textwrap.dedent("""
          [Unit]
          Description=Pterodactyl Queue Worker
          After=redis-server.service mariadb.service

          [Service]
          User=www-data
          Group=www-data
          Restart=always
          ExecStart=/usr/bin/php /var/www/pterodactyl/artisan queue:work --queue=high,standard,low --sleep=3 --tries=3
          StartLimitInterval=180
          StartLimitBurst=30
          RestartSec=5s
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          """).lstrip()

          with open('/tmp/wings.service', 'w') as f:
              f.write(wings_svc)
          with open('/tmp/pteroq.service', 'w') as f:
              f.write(pteroq_svc)
          print("Service files ditulis")
          PYEOF

          sudo cp /tmp/wings.service  /etc/systemd/system/wings.service
          sudo cp /tmp/pteroq.service /etc/systemd/system/pteroq.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now wings
          sudo systemctl enable --now pteroq
          echo "✅ Wings dan pteroq service aktif"

      # --------------------------------------------------
      # PART 8: CEK NODE + AUTO FIX
      # --------------------------------------------------
      - name: 8 - Cek Node Status dan Auto Fix
        run: |
          echo "Tunggu Wings fully up (15 detik)..."
          sleep 15

          check_node() {
            local retry=0
            local max=15
            while [ $retry -lt $max ]; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 http://localhost:8080/api/system 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ]; then
                echo "  Wings merespon HTTP $HTTP_CODE ✅"
                return 0
              fi
              echo "  [${retry}/${max}] Wings belum ready (HTTP: ${HTTP_CODE}), tunggu 6 detik..."
              retry=$((retry + 1))
              sleep 6
            done
            return 1
          }

          fix_wings() {
            echo "🔧 Jalankan auto fix..."
            sudo ufw allow 80/tcp   2>/dev/null || true
            sudo ufw allow 8080/tcp 2>/dev/null || true
            sudo ufw allow 2022/tcp 2>/dev/null || true
            sudo systemctl restart docker
            sleep 5
            sudo chown root:root /etc/pterodactyl/config.yml
            sudo chmod 600 /etc/pterodactyl/config.yml
            sudo systemctl restart nginx php8.2-fpm pteroq
            sudo systemctl restart wings
            sleep 15
          }

          if check_node; then
            echo "NODE_STATUS=🟢 HIJAU (Connected)" >> $GITHUB_ENV
          else
            echo "⚠️ Wings belum merespon, coba auto fix..."
            fix_wings
            if check_node; then
              echo "NODE_STATUS=🟢 HIJAU (Setelah auto fix)" >> $GITHUB_ENV
            else
              echo "NODE_STATUS=🔴 MERAH (Perlu manual fix)" >> $GITHUB_ENV
            fi
          fi

          echo ""
          echo "--- Wings log (15 baris terakhir) ---"
          sudo journalctl -u wings --no-pager -n 15 || true
          echo "--------------------------------------"

      # --------------------------------------------------
      # PART 9: CLOUDFLARE TUNNEL + KEEP ALIVE
      # --------------------------------------------------
      - name: 9 - Cloudflare Tunnel dan Keep Alive
        run: |
          PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me || curl -s --max-time 10 api.ipify.org)

          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

          nohup cloudflared tunnel --url http://localhost:80 \
            --logfile /tmp/cf.log --no-autoupdate > /tmp/cf_stdout.log 2>&1 &

          echo "Tunggu Cloudflare tunnel ready (20 detik)..."
          sleep 20

          CF_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' /tmp/cf.log | head -1)

          if [ -n "$CF_URL" ]; then
            sudo -u www-data sed -i "s|APP_URL=.*|APP_URL=${CF_URL}|" /var/www/pterodactyl/.env
            sudo -u www-data bash -c "cd /var/www/pterodactyl && php artisan config:clear && php artisan cache:clear"
          fi

          echo ""
          echo "========================================="
          echo "✅ INSTALASI SELESAI"
          echo "========================================="
          echo ""
          echo "🌐 PANEL URL:"
          if [ -n "$CF_URL" ]; then
            echo "   $CF_URL  (Cloudflare - pakai ini)"
          fi
          echo "   http://$PUBLIC_IP  (IP langsung port 80)"
          echo ""
          echo "🔑 LOGIN:"
          echo "   Email    : admin@sylent.com"
          echo "   Password : Admin123!"
          echo ""
          echo "📌 NODE STATUS : $NODE_STATUS"
          echo "   Wings API  : http://$PUBLIC_IP:8080"
          echo "   SFTP Port  : 2022"
          echo ""
          echo "🔧 STATUS SERVICES:"
          for svc in nginx php8.2-fpm mariadb redis wings pteroq; do
            STATUS=$(sudo systemctl is-active $svc 2>/dev/null || echo "unknown")
            echo "   $svc : $STATUS"
          done
          echo ""
          if echo "$NODE_STATUS" | grep -q "MERAH"; then
            echo "⚠️  NODE MASIH MERAH - manual fix:"
            echo "   sudo journalctl -u wings -f"
            echo "   sudo systemctl restart wings"
            echo "   cat /etc/pterodactyl/config.yml"
          fi
          echo "========================================="

          while true; do
            WINGS_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost:8080/api/system 2>/dev/null || echo "000")
            PANEL_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 http://localhost/ 2>/dev/null || echo "000")

            if [ "$WINGS_HTTP" = "000" ]; then
              echo "[$(date)] ⚠️ Wings down, auto restart..."
              sudo systemctl restart wings
            fi

            echo "[$(date)] Panel:${PANEL_HTTP} Wings:${WINGS_HTTP} | ${CF_URL:-http://$PUBLIC_IP}"
            sleep 240
          done
